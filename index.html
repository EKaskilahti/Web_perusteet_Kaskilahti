<h1>Etusivu</h1>

<p>Tervetuloa Jyväskylän uusimpaan kahvillaan! Huli's kahvilassa voit nauttia tuoreesta kahvista, herkullisista leivonnaisista ja rentoutua lautapelien ihmeellisessä maailmassa.</p>
<br>
<p>Kahvilassa järjestetään myös tapahtumia, joissa pääset pelaamaan muiden kahvilassa kävijöiden kanssa.</p>
